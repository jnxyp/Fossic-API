services:
  fossic-api:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app:ro
      - ./data:/data
    env_file:
      - .env
    environment:
      DOWNLOAD_STATS_DB_PATH: /data/download-stats.sqlite3
    networks:
      - default
      - forum-db

networks:
  forum-db:
    external: true
    name: fossicdiscuz_fossic-forum
